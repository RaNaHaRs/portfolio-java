<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1800" role="img" aria-labelledby="title description">
  <title id="title">RecoverLab CRM architecture and contribution blueprint</title>
  <desc id="description">A vertical request flow from browser to Nginx, Express API, and PostgreSQL. Contribution callouts are amber; platform context is blue.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#14304f" stroke-width="1"/>
    </pattern>
    <pattern id="minor-grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0V8" fill="none" stroke="#102640" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#38bdf8"/>
    </marker>
    <style>
      text{font-family:Consolas,monospace;fill:#bae6fd}
      .label{font-size:15px;letter-spacing:1px;fill:#38bdf8}
      .mark-label{fill:#f59e0b}
      .heading{font-size:20px;fill:#e6f4ff}
      .body{font-size:15px}
      .small{font-size:13px}
      .panel{fill:#0a1a2f;stroke:#38bdf8;stroke-width:2}
      .mark{fill:#201b16;stroke:#f59e0b;stroke-width:2}
      .context{fill:#0a1a2f;stroke:#38bdf8;stroke-width:2}
      .line{fill:none;stroke:#38bdf8;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="480" height="1800" fill="#0a1a2f"/>
  <rect width="480" height="1800" fill="url(#minor-grid)"/>
  <rect width="480" height="1800" fill="url(#grid)"/>
  <rect x="18" y="18" width="444" height="1764" fill="none" stroke="#38bdf8" stroke-width="2"/>

  <text class="label" x="40" y="65">SYSTEM BLUEPRINT</text>
  <text class="heading" x="40" y="100">RecoverLab CRM</text>

  <rect class="panel" x="55" y="145" width="370" height="112" rx="8"/>
  <text class="label" x="78" y="181">01 / CLIENT</text>
  <text class="heading" x="78" y="216">Browser · React client</text>
  <path class="line" d="M240 260V294"/>

  <rect class="panel" x="55" y="305" width="370" height="112" rx="8"/>
  <text class="label" x="78" y="341">02 / EDGE</text>
  <text class="heading" x="78" y="376">Nginx · reverse proxy / SSL</text>
  <path class="line" d="M240 420V454"/>

  <rect class="panel" x="55" y="465" width="370" height="112" rx="8"/>
  <text class="label" x="78" y="501">03 / APPLICATION</text>
  <text class="heading" x="78" y="536">Express API · Node.js</text>
  <path class="line" d="M240 580V614"/>

  <rect class="panel" x="55" y="625" width="370" height="112" rx="8"/>
  <text class="label" x="78" y="661">04 / DATA</text>
  <text class="heading" x="78" y="696">PostgreSQL · multi-tenant</text>

  <text class="label" x="40" y="790">CONTRIBUTED / INTERNSHIP RESPONSIBILITIES</text>
  <rect class="mark" x="40" y="815" width="400" height="76" rx="8"/>
  <text class="label mark-label" x="60" y="845">CONTRIBUTED</text>
  <text class="body" x="60" y="873">Responsive UI modules</text>

  <rect class="mark" x="40" y="905" width="400" height="76" rx="8"/>
  <text class="label mark-label" x="60" y="935">CONTRIBUTED</text>
  <text class="body" x="60" y="963">REST API integration</text>

  <rect class="mark" x="40" y="995" width="400" height="76" rx="8"/>
  <text class="label mark-label" x="60" y="1025">CONTRIBUTED</text>
  <text class="body" x="60" y="1053">Inventory and case management</text>

  <rect class="mark" x="40" y="1085" width="400" height="76" rx="8"/>
  <text class="label mark-label" x="60" y="1115">CONTRIBUTED</text>
  <text class="body" x="60" y="1143">Dynamic field configuration</text>

  <rect class="mark" x="40" y="1175" width="400" height="76" rx="8"/>
  <text class="label mark-label" x="60" y="1205">CONTRIBUTED</text>
  <text class="body" x="60" y="1233">User administration</text>

  <text class="label" x="40" y="1305">PLATFORM CONTEXT</text>
  <rect class="context" x="40" y="1330" width="400" height="66" rx="8"/>
  <text class="body" x="60" y="1371">JWT / role-based access</text>
  <rect class="context" x="40" y="1408" width="400" height="66" rx="8"/>
  <text class="body" x="60" y="1449">Socket.IO real-time channel</text>
  <rect class="context" x="40" y="1486" width="400" height="66" rx="8"/>
  <text class="body" x="60" y="1527">70+ PostgreSQL migrations</text>
  <rect class="context" x="40" y="1564" width="400" height="66" rx="8"/>
  <text class="body" x="60" y="1605">aaPanel / Nginx deployment</text>

  <rect x="40" y="1650" width="26" height="20" rx="3" fill="#201b16" stroke="#f59e0b" stroke-width="2"/>
  <text class="small" x="78" y="1666">Contributed responsibilities</text>
  <rect x="40" y="1684" width="26" height="20" rx="3" fill="#0a1a2f" stroke="#38bdf8" stroke-width="2"/>
  <text class="small" x="78" y="1700">Platform context</text>
  <text class="small" x="40" y="1740">WEB DEVELOPMENT INTERN / MAY–JUNE 2026</text>
  <text class="label" x="40" y="1768">SHEET 1 OF 1</text>
</svg>
