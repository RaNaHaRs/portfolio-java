spring:
  application:
    name: portfolio
  config:
    import:
      - classpath:content/profile.yml
      - classpath:content/home.yml
      - classpath:content/projects.yml
      - classpath:content/experience.yml
      - classpath:content/skills.yml
      - classpath:content/timeline.yml
      - classpath:content/certifications.yml
      - classpath:content/seo.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/portfolio}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:HarshPortfolio@2026}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 365d
          cache-public: true
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
server:
  compression:
    enabled: true
  shutdown: graceful
  forward-header-strategy: framework
  error:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
portfolio:
  site:
    base-url: ${SITE_BASE_URL:http://localhost:8080}
  contact:
    enabled: ${CONTACT_FORM_ENABLED:true}
    recipient: ${CONTACT_RECIPIENT:me@example.com}
    ip-hash-salt: ${IP_HASH_SALT:dev-only-change-me}
