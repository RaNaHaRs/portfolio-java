<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base(${pageTitle}, ${pageDescription}, ${canonicalUrl}, ${openGraphImageUrl}, 'projects', ~{::content})}">
<th:block th:fragment="content">
  <article class="container project-detail" th:with="project=${projectPage.project}">
    <header class="project-detail__header">
      <a class="project-detail__back" th:href="@{/projects}">← All projects</a>
      <p class="project-card__category" th:text="${project.category}">Project category</p>
      <h1 th:text="${project.title}">Project title</h1>
      <p class="project-detail__summary" th:text="${project.summary}">Project summary</p>
      <p class="project-card__type-note"
         th:if="${project.typeNote != null}"
         th:text="${project.typeNote}">Project contribution note</p>
      <ul class="project-card__stack" aria-label="Technology stack">
        <li class="chip" th:each="technology : ${project.stack}" th:text="${technology}">Technology</li>
      </ul>
      <nav class="project-card__actions" th:aria-label="|Links for ${project.title}|">
        <a class="button button--primary"
           th:if="${project.links.live != null}"
           th:href="${project.links.live}"
           target="_blank"
           rel="noopener noreferrer">Live demo</a>
        <a class="button button--secondary"
           th:if="${project.links.repository != null}"
           th:href="${project.links.repository}"
           target="_blank"
           rel="noopener noreferrer">GitHub repository</a>
      </nav>
    </header>

    <div class="project-detail__body">
      <nav class="project-toc card"
           th:if="${!projectPage.tableOfContents.isEmpty()}"
           aria-label="On this page">
        <h2>On this page</h2>
        <ol>
          <li th:each="heading : ${projectPage.tableOfContents}"
              th:classappend="${heading.level > 2 ? ' project-toc__item--nested' : ''}">
            <a th:href="|#${heading.id}|" th:text="${heading.label}">Section</a>
          </li>
        </ol>
      </nav>
      <div class="project-markdown" th:utext="${projectPage.caseStudyHtml}"></div>
    </div>

    <nav class="project-next" aria-label="Project navigation">
      <a class="button button--secondary" th:href="@{/projects}">All projects</a>
      <a class="button button--primary"
         th:if="${nextProject != null}"
         th:href="@{/projects/{slug}(slug=${nextProject.project.slug})}"
         th:text="|Next: ${nextProject.project.title}|">Next project</a>
    </nav>
  </article>
</th:block>
</html>
