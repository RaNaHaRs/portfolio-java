services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=portfolio'
      - 'POSTGRES_PASSWORD=Harsh@2607'
      - 'POSTGRES_USER=postgres'
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  mailpit:
    image: axllent/mailpit
    ports:
    - "1025:1025"
    - "8025:8025"

volumes:
  pgdata:
