services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: portfolio
    ports:
      - "5433:5432"
    volumes:
      - pgdata_v18:/var/lib/postgresql

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata_v18:
